#!KAMAILIO

debug=2
log_stderror=yes
children=2
tcp_children=2

auto_aliases=no
alias="__ADVERTISE_IP__"

# Non-default port: scanners still hammer 5060 and get nothing here.
listen=udp:0.0.0.0:15060 advertise __ADVERTISE_IP__:15060
listen=tcp:0.0.0.0:15060 advertise __ADVERTISE_IP__:15060

loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "ctl.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_text.so"
loadmodule "pike.so"

modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 0)

modparam("auth_db", "db_url", "text:///etc/kamailio/dbtext")
modparam("auth_db", "calculate_ha1", yes)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")
modparam("auth_db", "use_domain", 0)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 30)
modparam("registrar", "default_expires", 600)
modparam("registrar", "gruu_enabled", 0)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# About 16 requests per second from one address starts a block.
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 120)

request_route {
	# Flooders are dropped with no SIP reply.
	if (!pike_check_req()) {
		drop();
		exit;
	}

	xlog("L_INFO", "SIP $rm from $fu ruri=$ru src=$si:$sp\n");

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (is_method("OPTIONS") && uri==myself && $rU==$null) {
		sl_send_reply("200", "Keepalive");
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	# A door panel adds Route (its SIP proxy) and a registrar name in the
	# Request-URI. loose_route() then t_relay()s the REGISTER to that name.
	# The name resolves to this host, so the packet loops until Max-Forwards
	# and save() never runs. Answer the source port: the panel is behind NAT.
	if (is_method("REGISTER")) {
		force_rport();
		route(AUTH);
		if (!save("location")) {
			sl_reply_error();
		} else {
			xlog("L_INFO", "REGISTER ok user=$tU src=$si:$sp\n");
		}
		exit;
	}

	if (loose_route()) {
		route(RELAY);
		exit;
	}

	route(AUTH);
	consume_credentials();

	# Apartments 1-1000 dialed by the door station land on phone 101.
	# The dialed apartment stays in To and is copied into SIP parameters.
	if (is_method("INVITE") && $rU =~ "^([1-9][0-9]{0,2}|1000)$") {
		$var(apt) = $rU;
		append_hf("X-Apartment: $var(apt)\r\n");
		append_hf("X-Door-Station: $fU\r\n");
		$var(disp) = "Apt-" + $var(apt);
		subst('/^From:.*(<sip:[^>]+>)/From: "$var(disp)" \1/');
		$ru = "sip:101@" + $rd + ";apartment=" + $var(apt);
		xlog("L_INFO", "Apartment $var(apt) from $fU routed to 101\n");
	}

	if (is_method("INVITE|SUBSCRIBE|MESSAGE|UPDATE|REFER|OPTIONS")) {
		record_route();
	}

	if (!lookup("location")) {
		sl_send_reply("404", "User Not Found");
		exit;
	}

	route(RELAY);
}

# Unknown SIP users get no reply. Known users still get a digest challenge.
route[AUTH] {
	if (!is_subscriber("$fu", "subscriber", "2")) {
		xlog("L_WARN", "drop unknown user=$fU method=$rm src=$si:$sp\n");
		drop();
		exit;
	}
	if (!auth_check("$fd", "subscriber", "1")) {
		auth_challenge("$fd", "0");
		exit;
	}
}

route[RELAY] {
	xlog("L_INFO", "RELAY $rm ru=$ru from=$fu apt=$hdr(X-Apartment)\n");
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}
