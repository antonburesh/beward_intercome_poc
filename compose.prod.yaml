services:
  kamailio:
    build: ./kamailio
    container_name: sip
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/kamailio/entrypoint.sh"]
    env_file:
      - /etc/sip-server/env
    networks:
      tango_net:
        aliases: [sip]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/entrypoint.sh:/etc/kamailio/entrypoint.sh:ro
      - ./kamailio/dbtext/version:/etc/kamailio/dbtext/version:ro
      - /etc/sip-server/subscriber:/etc/kamailio/dbtext/subscriber:ro

  phone:
    build: .
    container_name: phone
    restart: unless-stopped
    depends_on: [kamailio]
    networks:
      tango_net:
        aliases: [phone]
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8091"
      SIP_BIND: 0.0.0.0
      SIP_PORT: "5062"
      SIP_REGISTER_HOST: sip
      RTP_PORT: "40000"
      VIDEO_PORT: "40002"
      WEBRTC_PORT: "40010"
    ports:
      - "127.0.0.1:8091:8091"
      - "5062:5062/udp"
      - "40000:40000/udp"
      - "40002:40002/udp"
      - "40010:40010/udp"
    volumes:
      - /etc/sip-server:/app/config

networks:
  tango_net:
    external: true
    name: tango_net
