name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start on the server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 158.160.176.80 >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude .git \
            --exclude config \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ admin@158.160.176.80:sip-server/
          ssh -i ~/.ssh/id_ed25519 admin@158.160.176.80 \
            "cd sip-server && sh deploy/up.sh"
