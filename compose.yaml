services:
  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:6.1-alpine
    container_name: sip
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/kamailio/entrypoint.sh"]
    environment:
      ADVERTISE_IP: ${ADVERTISE_IP}
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/entrypoint.sh:/etc/kamailio/entrypoint.sh:ro
      - ./kamailio/dbtext:/etc/kamailio/dbtext:ro
